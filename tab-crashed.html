<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Page paused after crash</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f6f8fc; color: #172033; }
    main { box-sizing: border-box; width: min(540px, calc(100vw - 48px)); padding: 38px; border: 1px solid #dce4f0; border-radius: 18px; background: #fff; box-shadow: 0 18px 48px rgba(26, 42, 73, .12); text-align: center; }
    .icon { display: grid; width: 46px; height: 46px; margin: 0 auto 16px; place-items: center; border-radius: 14px; background: #fff3d9; color: #9a6100; font-size: 24px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    p { margin: 12px 0 0; color: #546176; line-height: 1.55; }
    .note { color: #8b5b08; font-size: 13px; }
    .actions { display: flex; justify-content: center; gap: 10px; margin-top: 24px; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; background: #1c65d8; color: #fff; cursor: pointer; font: inherit; font-weight: 600; }
    button.secondary { border: 1px solid #cbd5e3; background: transparent; color: #2c3c57; }
    button:hover { filter: brightness(.95); }
    @media (prefers-color-scheme: dark) { body { background: #10151e; color: #edf2fa; } main { border-color: #2d3748; background: #18202c; box-shadow: none; } p { color: #b6c1d1; } button.secondary { border-color: #46566d; color: #dbe5f3; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <h1>This page was paused after a crash</h1>
    <p>The browser stopped while this page was active. It was not reopened automatically to protect the rest of your tabs.</p>
    <p class="note">Reloading may reproduce the crash.</p>
    <div class="actions">
      <button id="reload-page" type="button">Reload page</button>
      <button id="close-tab" class="secondary" type="button">Close tab</button>
    </div>
  </main>
  <script src="./tab-crashed.js"></script>
</body>
</html>
